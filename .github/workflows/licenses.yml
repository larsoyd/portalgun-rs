name: Licenses

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check license coverage and inventory
        run: python3 tools/check_licenses.py
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked -j 4
      - name: Check dependency licenses
        run: cargo deny --locked --workspace --all-features check licenses
