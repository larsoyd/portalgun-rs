[package]
name = "portalgun"
version = "0.1.0"
description = "Portal's portal gun in a Bevy test chamber, read from your own Portal install"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { version = "=0.19.1", features = ["wav", "dds"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
portal = { path = "crates/portal" }
winit = { version = "=0.30.13", default-features = false }

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
