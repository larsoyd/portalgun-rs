[package]
name = "portalgun"
version = "0.11.1"
description = "Portal's portal gun in a Bevy test chamber, read from your own Portal install"
edition.workspace = true
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
publish = false
rust-version.workspace = true

[dependencies]
bevy = { version = "=0.19.1", features = ["wav", "dds"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
portal = { path = "crates/portal" }
ttf-parser = "=0.25.1"
winit = { version = "=0.30.13", default-features = false }

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.95"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
